[[language]]
name = "javascript"
roots = ["bun.lock", "bun.lockb", "package.json"]
file-types = ["js"]
language-servers = ["vtsls"]
auto-format = true
formatter = { command = "bun", args = ["fmt", "--stdin-filepath=%{buffer_name}"] }

[[language]]
name = "jsx"
roots = ["bun.lock", "bun.lockb", "package.json"]
file-types = ["jsx"]
language-servers = ["vtsls"]
auto-format = true
formatter = { command = "bun", args = ["fmt", "--stdin-filepath=%{buffer_name}"] }

[[language]]
name = "tsx"
roots = ["bun.lock", "bun.lockb", "package.json"]
file-types = ["tsx"]
language-servers = ["vtsls"]
auto-format = true
formatter = { command = "bun", args = ["fmt", "--stdin-filepath=%{buffer_name}"] }

[[language]]
name = "typescript"
roots = ["bun.lock", "bun.lockb", "package.json"]
file-types = ["ts"]
language-servers = ["vtsls"]
auto-format = true
formatter = { command = "bun", args = ["fmt", "--stdin-filepath=%{buffer_name}"] }

[language-server.vtsls]
command = "bun"
args = ["x", "@vtsls/language-server", "--stdio"]
