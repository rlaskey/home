[[language]]
name = "typescript"
roots = ["bun.lock", "bun.lockb", "package.json"]
file-types = ["ts", "tsx"]
language-servers = ["typescript-language-server"]
auto-format = true
formatter = { command = "bun", args = ["fmt", "--stdin-filepath=%{buffer_name}"] }

[[language]]
name = "javascript"
roots = ["bun.lock", "bun.lockb", "package.json"]
file-types = ["js", "jsx"]
language-servers = ["typescript-language-server"]
auto-format = true
formatter = { command = "bun", args = ["fmt", "--stdin-filepath=%{buffer_name}"] }

[language-server.typescript-language-server]
command = "bun"
args = ["x", "typescript-language-server", "--stdio"]
